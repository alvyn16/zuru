[package]
name = "zuru"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "A navy-themed, three-pane terminal file manager"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = "0.4"
crossterm = "0.29"
directories = "6"
flate2 = "1"
fuzzy-matcher = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff", "pnm", "qoi"] }
ignore = "0.4"
jwalk = "0.8"
mime_guess = "2"
notify = "8"
open = "5"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
ratatui-image = { version = "11.0.8", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
shell-words = "1"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
tar = "0.4"
toml = "0.9"
trash = "5"
unicode-width = "0.2"
walkdir = "2"
zip = { version = "4", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
serde_json = "1"

[profile.release]
lto = "thin"
strip = true

# Keep cargo run responsive while retaining debug symbols.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
